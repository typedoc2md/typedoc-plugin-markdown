# The one check required on `main`. It deliberately has no path filter: the
# per-package workflows only run when their package changes, so requiring any
# of their checks would leave a docs-only or changeset-only pull request
# waiting forever for a check that never reports.
name: Gate
on:
  push:
    branches:
      - main
  pull_request:
permissions:
  contents: read
concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  gate:
    name: Gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '20.19.0'
          cache: 'npm'
      - name: Install
        run: HUSKY=0 npm ci
      - name: Lint
        run: npm run lint-all
      - name: Build All Workspaces
        run: npm run build-all
      - name: Test All Workspaces
        run: npm run test-all
